name: ci-sanity
on: [push, pull_request]
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install shfmt
        run: |
          ver=3.8.0
          curl -sSL "https://github.com/mvdan/sh/releases/download/v${ver}/shfmt_v${ver}_linux_amd64" -o shfmt
          sudo install -m 0755 shfmt /usr/local/bin/shfmt

      - name: Lint & format (make check)
        run: make check

      - name: Fail if formatting changed files
        run: |
          git status --porcelain
          git diff --exit-code || { echo "❌ shfmt changed files. Please run 'make fmt' locally and commit."; exit 1; }

      - name: Script self-test (no side effects)
        env:
          RUN_SELFTEST: "1"
        run: |
          bash -n pihole_maintenance_pro.sh
          if command -v pihole >/dev/null 2>&1; then
            ./pihole_maintenance_pro.sh --no-apt --no-upgrade --no-gravity --no-dnsreload
          else
            echo "Skipping self-test: pihole CLI not available in CI."
          fi
